<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dấu hiệu Beeknoee (bản ngắn) — dùng làm icon app.
  Nguồn: bee_project/frontend/src/assets/beeknoee/Beeknoee-Short-Logo-dark.svg
  Bản cho NỀN SÁNG: đuôi gradient là xanh nhạt, không phải trắng.

  gradientUnits="userSpaceOnUse" là BẮT BUỘC. Mặc định là objectBoundingBox,
  nghĩa là MỖI path được tô một gradient riêng — 6 khối sẽ thành 6 dải màu rời
  rạc thay vì một dải chạy suốt logo. Toạ độ dưới đây nằm trong hệ của <g>
  (0..5500), tức trước phép translate/scale.
-->
